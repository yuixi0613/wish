<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星空樟樹・許願樹</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC",system-ui,sans-serif;background:#07132b;color:#fff}body{overflow-x:hidden}.app{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(#06112b 0%,#0b2350 48%,#173c39 72%,#0d2a1e 100%)}.stars,.stars:before,.stars:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(184,221,255,.7) 0 1px,transparent 1.5px);background-size:97px 83px,151px 127px;background-position:10px 20px,45px 8px;opacity:.65}.stars:before{transform:scale(1.3);opacity:.25;filter:blur(.4px)}.moon{position:absolute;right:8%;top:8%;width:110px;height:110px;border-radius:50%;background:#fff5d8;box-shadow:0 0 45px rgba(255,238,190,.35)}.moon:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:#07132b;left:34px;top:-8px}.content{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px 45px}.title{text-align:center;text-shadow:0 3px 20px #0008}.title h1{font-family:serif;font-size:clamp(30px,5vw,52px);letter-spacing:.18em;margin:0 0 8px}.title p{margin:0;color:#dbe9db;letter-spacing:.12em}.tree-scene{position:relative;width:min(1050px,100%);height:min(65vh,650px);min-height:450px;margin-top:5px}.ground{position:absolute;bottom:0;left:-10%;width:120%;height:33%;border-radius:50% 50% 0 0/45% 45% 0 0;background:radial-gradient(ellipse at 50% 20%,#386b45,#153b2b 65%,#092319);box-shadow:0 -20px 55px #183f2e}.tree{position:absolute;left:50%;bottom:5%;width:560px;height:560px;transform:translateX(-50%)}.trunk{position:absolute;left:43%;bottom:0;width:17%;height:55%;background:linear-gradient(90deg,#3a2418,#6c4326 48%,#2d1d15);border-radius:48% 48% 15% 18%;transform:rotate(-2deg);box-shadow:inset 12px 0 #28181088,inset -9px 0 #9a623833}.branch{position:absolute;background:#3b2518;border-radius:99px;transform-origin:left center}.b1{width:310px;height:26px;left:39%;bottom:43%;transform:rotate(-27deg)}.b2{width:300px;height:25px;left:45%;bottom:48%;transform:rotate(22deg)}.b3{width:245px;height:20px;left:46%;bottom:58%;transform:rotate(-8deg)}.b4{width:220px;height:18px;left:43%;bottom:65%;transform:rotate(27deg)}.crown{position:absolute;inset:4% 3% 29%}.leaf-cluster{position:absolute;width:190px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 40%,#5b9860,#1d5739 72%);filter:drop-shadow(0 12px 12px #06140d88)}.l1{left:4%;top:35%}.l2{left:25%;top:12%}.l3{left:43%;top:27%}.l4{left:63%;top:8%}.l5{right:1%;top:34%}.l6{left:22%;top:52%}.l7{left:51%;top:53%}.leaf{position:absolute;width:38px;height:62px;background:linear-gradient(145deg,#88b866,#316b3e);border-radius:100% 0 100% 0;transform:rotate(28deg);box-shadow:inset -3px -5px #244d32aa}.leaf:after{content:"";position:absolute;width:2px;height:55px;background:#c7d89a88;left:18px;top:4px;transform:rotate(-25deg)}.leaf:nth-child(1){left:10%;top:18%}.leaf:nth-child(2){left:31%;top:5%;transform:rotate(-15deg)}.leaf:nth-child(3){left:48%;top:17%;transform:rotate(52deg)}.leaf:nth-child(4){left:69%;top:4%;transform:rotate(-20deg)}.leaf:nth-child(5){right:6%;top:28%;transform:rotate(42deg)}.leaf:nth-child(6){left:26%;top:42%;transform:rotate(5deg)}.leaf:nth-child(7){left:56%;top:42%;transform:rotate(65deg)}.wish-card{position:absolute;width:120px;min-height:92px;padding:13px 11px 12px;background:linear-gradient(135deg,#dbe8a7,#a8c47d);color:#25351f;clip-path:polygon(10% 4%,90% 0,100% 88%,80% 100%,12% 94%,0 18%);box-shadow:0 7px 14px #0008;font-family:serif;z-index:4;transform-origin:top center;animation:sway 4s ease-in-out infinite}.wish-card:before{content:"";position:absolute;top:-15px;left:50%;width:2px;height:22px;background:#d7c18a;transform:translateX(-50%)}.wish-card small{display:block;font-size:10px;opacity:.65;margin-bottom:6px}.wish-card p{margin:0;font-size:14px;line-height:1.35;word-break:break-word}.card-a{left:14%;top:35%;transform:rotate(-8deg)}.card-b{left:37%;top:22%;transform:rotate(6deg);animation-delay:-1.2s}.card-c{left:61%;top:37%;transform:rotate(-4deg);animation-delay:-2s}.card-d{left:48%;top:63%;transform:rotate(9deg);animation-delay:-.5s}.card-e{left:75%;top:20%;transform:rotate(7deg);animation-delay:-2.8s}.hint{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:13px;color:#d4e4cf;background:#071b16aa;padding:8px 14px;border:1px solid #ffffff18;border-radius:999px;backdrop-filter:blur(6px);white-space:nowrap}@keyframes sway{50%{rotate:2deg;translate:0 3px}}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:13px 22px;font-size:15px;cursor:pointer;font-weight:700}.primary{background:#e9e0ad;color:#263b2b;box-shadow:0 7px 20px #0004}.secondary{background:#ffffff16;color:#fff;border:1px solid #ffffff2b}.modal{position:fixed;inset:0;background:#020815aa;backdrop-filter:blur(8px);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.panel{width:min(700px,100%);max-height:92vh;overflow:auto;background:#f4f0dc;color:#26352b;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0008}.panel h2{font-family:serif;text-align:center;margin:0 0 6px;font-size:30px}.sub{text-align:center;color:#61705f;margin:0 0 18px}.leaf-paper{position:relative;background:#dce7ae;border-radius:35% 65% 42% 58%/50% 43% 57% 50%;padding:30px 28px;min-height:330px;box-shadow:inset 0 0 35px #69894c44,0 12px 30px #4b573244}.leaf-paper:after{content:"";position:absolute;width:3px;height:85%;left:50%;top:8%;background:#6e8a55aa;transform:rotate(18deg)}textarea{position:relative;z-index:2;width:100%;height:190px;resize:none;border:0;background:#ffffff35;border-radius:18px;padding:18px;font:17px/1.6 serif;color:#26352b;outline:none}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}.tools button{border:1px solid #81936d55;background:#fff8;border-radius:10px;padding:8px 11px;cursor:pointer}.canvas-wrap{position:relative;z-index:2;background:#ffffff55;border-radius:18px;overflow:hidden}.canvas-wrap canvas{display:block;width:100%;height:180px;touch-action:none}.row{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.row button{padding:11px 18px;border-radius:999px;border:0;cursor:pointer}.send{background:#315b3b;color:white}.close{background:#ddd8c5;color:#344334}.flying{position:fixed;z-index:30;width:100px;min-height:75px;padding:10px;background:#dce7ae;color:#26352b;clip-path:polygon(10% 4%,90% 0,100% 88%,80% 100%,12% 94%,0 18%);animation:fly 1.5s cubic-bezier(.2,.8,.2,1) forwards}.flying p{font:12px serif;margin:0;word-break:break-word}@keyframes fly{0%{left:50%;top:60%;rotate:0deg;scale:1}45%{left:55%;top:30%;rotate:35deg;scale:1.08}100%{left:50%;top:35%;rotate:-8deg;scale:.72;opacity:0}}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#081b16dd;border:1px solid #ffffff22;padding:11px 17px;border-radius:999px;z-index:50;transition:.3s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:650px){.tree{scale:.72;transform:translateX(-69%);transform-origin:bottom center}.tree-scene{height:470px}.wish-card{width:96px;min-height:72px}.wish-card p{font-size:11px}.hint{font-size:11px}.panel{padding:18px}.moon{width:70px;height:70px}.moon:after{width:70px;height:70px;left:22px}}
</style></head><body><main class="app"><div class="stars"></div><div class="moon"></div><section class="content"><header class="title"><h1>星空樟樹・許願所</h1><p>把願望寫在一片葉子上，讓晚風吹它去見星星。</p></header><section class="tree-scene"><div class="ground"></div><div class="tree"><div class="trunk"></div><div class="branch b1"></div><div class="branch b2"></div><div class="branch b3"></div><div class="branch b4"></div><div class="crown"><div class="leaf-cluster l1"></div><div class="leaf-cluster l2"></div><div class="leaf-cluster l3"></div><div class="leaf-cluster l4"></div><div class="leaf-cluster l5"></div><div class="leaf-cluster l6"></div><div class="leaf-cluster l7"></div><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i></div><div id="cards"><div class="wish-card card-a"><small>🌿 願望</small><p>願今天也能遇見溫柔的事。</p></div><div class="wish-card card-b"><small>🌿 願望</small><p>希望喜歡的人都平安快樂。</p></div><div class="wish-card card-c"><small>🌿 願望</small><p>想去看看更遠的星星。</p></div><div class="wish-card card-d"><small>🌿 願望</small><p>願努力的事情有一天開花。</p></div><div class="wish-card card-e"><small>🌿 願望</small><p>希望世界一直保有好奇心。</p></div></div></div><div class="hint">目前樹上有 <b id="count">5</b> 片願望葉 · 點下方按鈕留下你的願望</div></section><div class="actions"><button class="btn primary" id="open">🍃 拿一張葉子許願</button><button class="btn secondary" id="clear">重新觀看星空</button></div></section><div class="modal" id="modal"><div class="panel"><h2>🍃 一片樟樹葉</h2><p class="sub">寫下願望，或親手畫下想說的話。</p><div class="leaf-paper"><textarea id="wish" maxlength="120" placeholder="我希望……"></textarea><div class="tools"><button id="drawMode">✎ 手繪</button><button id="textMode">Aa 文字</button><button id="clearCanvas">清除畫布</button><label>筆色 <input type="color" id="color" value="#315b3b"></label></div><div class="canvas-wrap"><canvas id="canvas"></canvas></div></div><div class="row"><button class="close" id="cancel">先收起來</button><button class="send" id="send">✨ 讓願望飛上樹</button></div></div></div><div class="toast" id="toast">願望已掛上星空樟樹 🌙</div></main><script>
const modal=document.getElementById('modal'),open=document.getElementById('open'),cancel=document.getElementById('cancel'),send=document.getElementById('send'),wish=document.getElementById('wish'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),toast=document.getElementById('toast'),cards=document.getElementById('cards'),count=document.getElementById('count');let drawing=false,draw=true;
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle=document.getElementById('color').value}new ResizeObserver(resize).observe(canvas);setTimeout(resize,50);
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,y:(e.touches?e.touches[0].clientY:e.clientY)-r.top}}function down(e){if(!draw)return;drawing=true;ctx.beginPath();const p=pos(e);ctx.moveTo(p.x,p.y);e.preventDefault()}function move(e){if(!drawing||!draw)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}function up(){drawing=false}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',up);document.getElementById('drawMode').onclick=()=>draw=true;document.getElementById('textMode').onclick=()=>{draw=false;wish.focus()};document.getElementById('clearCanvas').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height)};document.getElementById('color').oninput=e=>ctx.strokeStyle=e.target.value;
open.onclick=()=>{modal.classList.add('show');wish.focus()};cancel.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};document.getElementById('clear').onclick=()=>{document.querySelectorAll('.wish-card').forEach(c=>c.animate([{opacity:1},{opacity:.25},{opacity:1}],{duration:900}));toast.textContent='抬頭看看今晚的星星吧 ✦';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)};
send.onclick=()=>{const t=wish.value.trim();if(!t&&canvas.toDataURL().length<1000){wish.focus();toast.textContent='先寫下一個願望吧 🍃';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);return}const f=document.createElement('div');f.className='flying';f.innerHTML='<p>🌿 '+(t||'一個畫在葉子上的願望')+'</p>';document.body.appendChild(f);modal.classList.remove('show');wish.value='';ctx.clearRect(0,0,canvas.width,canvas.height);setTimeout(()=>{f.remove();const c=document.createElement('div');c.className='wish-card';c.style.left=(18+Math.random()*64)+'%';c.style.top=(12+Math.random()*58)+'%';c.style.transform='rotate('+(Math.random()*18-9)+'deg)';c.innerHTML='<small>🌿 新願望</small><p>'+escapeHtml(t||'一幅小小的心願')+'</p>';cards.appendChild(c);count.textContent=document.querySelectorAll('.wish-card').length;toast.textContent='願望已掛上星空樟樹 🌙';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)},1450)};
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
